# The session-worker bundle: the per-session Agent process over dsh-base.
# It mounts the complete Session Controller, jobs, file upload, workspace
# registry, and forwarded Remote event source, but no Web server, browser
# roster, or client transport. The bridge owns the inherited fd 7 control
# channel that the host supervisor speaks.

- id: system-prompt
  config:
    personaPrefix: >-
      You are a coding agent powered by the {{model}} model.

- id: hmr
  disabled: true

- insert:
    # Connection provides the in-process Peer, the shared `/api` Fetch handler,
    # and the interceptor Gateway uses for unary dispatch. No webserver row is
    # mounted, so it binds no port and registers no HTTP route.
    - id: connection
      name: '@deepseek-ai/dsh-client-connection'

    # The Session Controller requires the workspace registry for create, scope
    # resolution, and archived-session admission. The registry is durable state,
    # not a Host write surface.
    - id: workspace
      name: '@deepseek-ai/dsh-workspace'

    # Membership writes belong to the Host: this process serves no Workspace
    # projection, so its own write would leave the browser's Workspace list
    # without the Session until a reload. The Host router attaches after the
    # routed create or fork succeeds.
    - id: session-controller
      name: '@deepseek-ai/dsh-api-session-controller'
      config:
        attachWorkspaceSessions: false

    - id: job-controller
      name: '@deepseek-ai/dsh-api-job-controller'

    - id: workspace-files
      name: '@deepseek-ai/dsh-api-workspace-files'

    - id: file-upload
      name: '@deepseek-ai/dsh-client-file-upload'

    - id: api-remotes
      name: '@deepseek-ai/dsh-api-remotes'

    - id: session-worker-bridge
      name: '@deepseek-ai/dsh-session-worker-bridge'
      config:
        idleQuietMs: 1000
        idlePollMs: 250

    # Host-owned services the presets read, forwarded over the bridge's
    # reverse-call channel (Schedule keeps one store and timer in the Host).
    # When the Host passes the advertised GUI URL, this row also provides
    # `webApp` for the dev-context row below.
    - id: session-worker-host-services
      name: '@deepseek-ai/dsh-session-worker-bridge/host-services'

    # The same runtime context the single-process Web composition mounts: the
    # implementation checkout and the advertised GUI URL. The Host sets
    # DSH_WEB_URL on spawn; a worker without a Web surface keeps the row off.
    - id: harness-dev-context
      name: '@deepseek-ai/dsh-harness-dev-context'
      disabled: !!js '!process.env.DSH_WEB_URL'
